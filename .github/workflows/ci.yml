name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION_KEY: ${{ vars.SONAR_ORGANIZATION_KEY || secrets.SONAR_ORGANIZATION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pharmacy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmacy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pharmacy
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_PASSWORD: ""
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: ci
          SPRING_RABBITMQ_PASSWORD: ci-password
          SPRING_AI_OPENAI_API_KEY: ci-placeholder-key
          JWT_SECRET: ci-only-signing-secret-that-is-at-least-32-bytes-long
          CLOUDINARY_CLOUD_NAME: ci-test
          CLOUDINARY_API_KEY: ci-test
          CLOUDINARY_API_SECRET: ci-test
          PAYOS_CLIENT_ID: ci-test
          PAYOS_API_KEY: ci-test
          PAYOS_CHECKSUM_KEY: ci-test
        run: bash ./mvnw -B -ntp verify

      - name: Validate SonarCloud configuration
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Set SONAR_PROJECT_KEY in repository Variables or Secrets"; exit 1; }
          test -n "$SONAR_ORGANIZATION_KEY" || { echo "::error::Set SONAR_ORGANIZATION_KEY in repository Variables or Secrets"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "::error::Set SONAR_TOKEN in repository Secrets"; exit 1; }

      - name: Analyze with SonarQube Cloud
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: >-
          bash ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.organization="$SONAR_ORGANIZATION_KEY"
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
